{% load i18n ui %}
{% if page.has_other_pages %}
<nav class="pagination" aria-label="{% trans 'Pages' %}">
  {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">{% trans "Previous" %}</a>{% endif %}
  <span class="current">{% blocktrans with n=page.number total=page.paginator.num_pages %}Page {{ n }} of {{ total }}{% endblocktrans %}</span>
  {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">{% trans "Next" %}</a>{% endif %}
</nav>
{% endif %}
